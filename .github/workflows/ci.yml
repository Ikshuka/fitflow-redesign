name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    name: Validate Documentation & Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "Checking essential folders..."
          test -d frontend || (echo "frontend/ missing" && exit 1)
          test -d backend || (echo "backend/ missing" && exit 1)
          test -d ai-service || (echo "ai-service/ missing" && exit 1)
          test -d docs || (echo "docs/ missing" && exit 1)

          echo "Checking essential activity-numbered documentation..."
          test -f docs/activity-1-frontend-comparison.md || (echo "activity-1-frontend-comparison.md missing" && exit 1)
          test -f docs/activity-2-backend-comparison.md || (echo "activity-2-backend-comparison.md missing" && exit 1)
          test -f docs/activity-3-decision-matrix.md || (echo "activity-3-decision-matrix.md missing" && exit 1)
          test -f docs/activity-4-architecture.md || (echo "activity-4-architecture.md missing" && exit 1)
          test -f docs/activity-4-ADR-001-technology-stack.md || (echo "activity-4-ADR missing" && exit 1)
          test -f README.md || (echo "Root README.md missing" && exit 1)

          echo "All activity-numbered structural and documentation checks passed successfully!"
